name: Release

# A release is published by pushing a tag vX.Y.Z that points into main. Nothing else
# starts this workflow. The upload to PyPI waits for the manual approval of the `pypi`
# environment (restrict that environment to deployments from tags matching vN.N.N) and uses
# trusted publishing: no token is stored anywhere.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    name: Check the tag, test and build
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag points into main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: The tag, the package version and the changelog agree
        run: uv run python tests/support/release_tag.py "${GITHUB_REF_NAME}"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -n auto
      - run: uv build
      - name: The files hold nothing private and the package
        run: uv run python tests/support/package_check.py dist
      - name: The wheel installs and runs
        run: |
          uvx --from dist/*.whl sva2yosys --version
          cd examples/counter
          uvx --from ../../dist/*.whl sva2yosys props/counter_props.sv -y rtl --top counter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sva2yosys
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
